# Builds the browser version and publishes web/ to GitHub Pages.
#
# The wasm is 17 MB and generated, so it is built here rather than committed:
# a binary that size in the history would cost another 17 MB on every rebuild.
# The tests here are the physics ones; the step says why not the rest. One manual
# step is needed once, in the repository's settings:
#
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#
# After that every push to master republishes https://pavel-krush.github.io/fsim/
name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and let a newer push win rather than queueing behind
# a build whose result is already stale.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The physics, which is pure Go and needs nothing from the runner. The
      # interface package is deliberately not tested here: on Linux, Ebiten's GLFW
      # backend wants the X11 and GL headers to build and a DISPLAY to so much as
      # import -- its package init calls glfw.Init() -- so running tests that never
      # open a window would cost six minutes of X11 dev packages plus xvfb. The
      # step below still compiles the whole program, so nothing broken gets past.
      - name: Test the physics
        run: go test ./sim/...

      - name: Build for the browser
        run: |
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o web/fsim.wasm .
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/wasm_exec.js
          ls -la web/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          # Half an hour rather than the default ten minutes. Seventeen megabytes of
          # wasm takes Pages five to seven to distribute, which is close enough to
          # the default that one run timed out on it and published nothing.
          timeout: 1800000
