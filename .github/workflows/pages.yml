# Builds the browser version and publishes web/ to GitHub Pages.
#
# The wasm is 17 MB and generated, so it is built here rather than committed:
# a binary that size in the history would cost another 17 MB on every rebuild.
# One manual step is needed once, in the repository's settings:
#
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#
# After that every push to master republishes https://pavel-krush.github.io/fsim/
name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and let a newer push win rather than queueing behind
# a build whose result is already stale.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The interface package links Ebiten's GLFW backend through cgo, so building
      # it — even just to run tests that never open a window — needs the X11 and
      # GL headers. The runner has none of them by default, which is what a bare
      # `go test ./...` fell over on. sim/ compiles and tests without any of this.
      - name: Ebiten's build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends             libc6-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxi-dev             libxinerama-dev libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config

      - name: Test on the host platform
        run: go test ./...

      - name: Build for the browser
        run: |
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o web/fsim.wasm .
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/wasm_exec.js
          ls -la web/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
